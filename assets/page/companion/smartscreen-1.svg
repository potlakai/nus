<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Windows protected your PC. Click More info.">
  <rect width="320" height="200" rx="6" fill="#0063b1"/>
  <g font-family="'Segoe UI',system-ui,sans-serif" fill="#fff">
    <text x="18" y="38" font-size="17" font-weight="600">Windows protected your PC</text>
    <text x="18" y="66" font-size="10.5" opacity=".92">Microsoft Defender SmartScreen prevented an</text>
    <text x="18" y="81" font-size="10.5" opacity=".92">unrecognized app from starting. Running this</text>
    <text x="18" y="96" font-size="10.5" opacity=".92">app might put your PC at risk.</text>
    <text x="18" y="121" font-size="11" text-decoration="underline">More info</text>
  </g>
  <rect x="11" y="106" width="64" height="22" rx="4" fill="none" stroke="#ffd166" stroke-width="2.5"/>
  <rect x="226" y="160" width="80" height="26" fill="none" stroke="#fff" stroke-opacity=".7"/>
  <text x="266" y="177" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#fff" text-anchor="middle">Don't run</text>
</svg>
